    <script>
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            }
          });
        } catch (e) {
          // ignore
        }

        var origConsoleError = console.error ? console.error.bind(console) : null;
        if (origConsoleError) {
          console.error = function() {
            var firstArg = arguments[0] ? String(arguments[0]) : '';
            if (
              firstArg.indexOf('failed to connect to websocket') !== -1 ||
              firstArg.indexOf('WebSocket closed without opened') !== -1
            ) {
              return;
            }
            return origConsoleError.apply(console, arguments);
          };
        }

        window.addEventListener('error', function(event) {
          if (
            event &&
            ((event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
              (event.message &&
                (event.message.indexOf('Cannot set property fetch') !== -1 ||
                  event.message.indexOf('WebSocket closed without opened') !== -1 ||
                  event.message.indexOf('failed to connect to websocket') !== -1)))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.stack || reason.message || String(reason))) || '';
          if (
            typeof msg === 'string' &&
            (msg.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1 ||
              msg.indexOf('WebSocket closed without opened') !== -1 ||
              msg.indexOf('failed to connect to websocket') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
