<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            }
          });
        } catch (e) {
          // ignore
        }

        window.addEventListener('error', function(event) {
          if (
            event &&
            ((event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
              (event.message && event.message.indexOf('Cannot set property fetch') !== -1))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var stack = (reason && (reason.stack || reason.message)) || '';
          if (
            typeof stack === 'string' &&
            (stack.indexOf('chrome-extension://') !== -1 ||
              stack.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
