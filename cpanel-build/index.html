    <script type="module">
      import { transform } from 'https://esm.sh/sucrase@3.35.0';

      const BUILD_VERSION = '20261022-v4';

      const files = [
        'types/trading.ts',
        'i18n/translations.ts',
        'context/LanguageContext.tsx',
        'data/assets.ts',
        'data/academyData.ts',
        'data/patternsData.ts',
        'utils/indicators.ts',
        'components/Patterns/PatternSvg.tsx',
        'components/Patterns/PatternGallery.tsx',
        'components/Navbar.tsx',
        'components/MarketSectionsBar.tsx',
        'components/Chart/CandlestickChart.tsx',
        'components/Simulator/PaperTradingPanel.tsx',
        'components/Academy/AcademyView.tsx',
        'components/Calculator/RiskCalculator.tsx',
        'components/Mentor/AiMentorView.tsx',
        'components/MarketIntel/MarketIntelView.tsx',
        'components/Legal/LegalPagesView.tsx',
        'App.tsx',
        'main.tsx',
      ];

      function normalizePath(dir, rel) {
        const parts = (dir === '.' ? [] : dir.split('/')).concat(rel.split('/'));
        const out = [];
        for (const p of parts) {
          if (!p || p === '.') continue;
          if (p === '..') out.pop();
          else out.push(p);
        }
        return out.join('/');
      }

      async function boot() {
        const sources = await Promise.all(
          files.map(async (f) => {
            const res = await fetch('/src/' + f + '?v=' + BUILD_VERSION, { cache: 'no-store' });
            if (!res.ok) {
              throw new Error('Failed to load /src/' + f + ' (' + res.status + ')');
            }
            const text = await res.text();
            return [f, text];
          })
        );

        const blobUrls = {};
        for (const [f, rawSource] of sources) {
          const key = f.replace(/\.(tsx|ts)$/, '');
          const dir = key.includes('/') ? key.slice(0, key.lastIndexOf('/')) : '.';
          const cleaned = rawSource.replace(/import\s+['"]\.\/index\.css['"];?/g, '');
          let compiled = transform(cleaned, {
            transforms: ['typescript', 'jsx'],
            jsxRuntime: 'automatic',
            production: true,
          }).code;

          compiled = compiled.replace(
            /((?:from|import)\s+['"])(\.[^'"]+)(['"])/g,
            (match, prefix, relPath, suffix) => {
              const targetKey = normalizePath(dir, relPath.replace(/\.(tsx|ts|js)$/, ''));
              const blobUrl = blobUrls[targetKey];
              return blobUrl ? prefix + blobUrl + suffix : match;
            }
          );

          if (!compiled.trim()) compiled = 'export {};';
          blobUrls[key] = URL.createObjectURL(
            new Blob([compiled], { type: 'text/javascript' })
          );
        }

        await import(blobUrls['main']);
      }

      boot().catch((err) => {
        console.error('Tradebd boot error:', err);
        const rootEl = document.getElementById('root');
        if (rootEl) {
          rootEl.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0f19;color:#f8fafc;font-family:sans-serif;padding:24px;text-align:center;">' +
            '<div style="color:#10b981;font-weight:800;font-size:18px;margin-bottom:8px;">Tradebd আপডেট লোড হচ্ছে...</div>' +
            '<p style="color:#94a3b8;font-size:13px;max-width:420px;margin-bottom:16px;">ব্রাউজার ক্যাশের কারণে পুরনো ফাইল লোড হয়েছিল। নিচের বাটনে ক্লিক করে পেজটি রিলোড করুন।</p>' +
            '<button onclick="window.location.reload(true)" style="background:#10b981;color:#020617;border:none;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;">রিলোড করুন (Reload Now)</button>' +
            '</div>';
        }
      });
    </script>
