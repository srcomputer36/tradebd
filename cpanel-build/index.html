<!doctype html>

  <head>

    <script>
      (function () {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return currentFetch;
            },
            set: function (newFetch) {
              currentFetch = newFetch;
            },
          });
        } catch (e) {}
      })();
    </script>
    <title>Tradebd - ট্রেডিং একাডেমি ও টেকনিক্যাল অ্যানালাইসিস প্ল্যাটফর্ম</title>

    <meta

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react-dom": "https://esm.sh/react-dom@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
          "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
          "lucide-react": "https://esm.sh/lucide-react@0.546.0?external=react",
          "motion/react": "https://esm.sh/motion@12.23.24/react?external=react,react-dom"
        }
      }
    </script>

  <body class="bg-[#0b0f19] text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root">
      <div class="min-h-screen flex items-center justify-center bg-[#0b0f19] text-emerald-400 font-bold text-sm tracking-wide">
        Tradebd লোড হচ্ছে...
      </div>
    </div>
    <script type="module">
      import { transform } from 'https://esm.sh/sucrase@3.35.0';

      const files = [
        'types/trading.ts',
        'i18n/translations.ts',
        'context/LanguageContext.tsx',
        'data/assets.ts',
        'data/academyData.ts',
        'data/patternsData.ts',
        'utils/indicators.ts',
        'components/Patterns/PatternSvg.tsx',
        'components/Patterns/PatternGallery.tsx',
        'components/Navbar.tsx',
        'components/MarketSectionsBar.tsx',
        'components/Chart/CandlestickChart.tsx',
        'components/Simulator/PaperTradingPanel.tsx',
        'components/Academy/AcademyView.tsx',
        'components/Calculator/RiskCalculator.tsx',
        'components/Mentor/AiMentorView.tsx',
        'App.tsx',
        'main.tsx',
      ];

      function normalizePath(dir, rel) {
        const parts = (dir === '.' ? [] : dir.split('/')).concat(rel.split('/'));
        const out = [];
        for (const p of parts) {
          if (!p || p === '.') continue;
          if (p === '..') out.pop();
          else out.push(p);
        }
        return out.join('/');
      }

      async function boot() {
        const sources = await Promise.all(
          files.map(async (f) => {
            const res = await fetch('/src/' + f);
            const text = await res.text();
            return [f, text];
          })
        );

        const blobUrls = {};
        for (const [f, rawSource] of sources) {
          const key = f.replace(/\.(tsx|ts)$/, '');
          const dir = key.includes('/') ? key.slice(0, key.lastIndexOf('/')) : '.';
          const cleaned = rawSource.replace(/import\s+['"]\.\/index\.css['"];?/g, '');
          let compiled = transform(cleaned, {
            transforms: ['typescript', 'jsx'],
            jsxRuntime: 'automatic',
            production: true,
          }).code;

          compiled = compiled.replace(
            /(from\s+['"])(\.[^'"]+)(['"])/g,
            (match, prefix, relPath, suffix) => {
              const targetKey = normalizePath(dir, relPath.replace(/\.(tsx|ts|js)$/, ''));
              const blobUrl = blobUrls[targetKey];
              return blobUrl ? prefix + blobUrl + suffix : match;
            }
          );

          if (!compiled.trim()) compiled = 'export {};';
          blobUrls[key] = URL.createObjectURL(
            new Blob([compiled], { type: 'text/javascript' })
          );
        }

        await import(blobUrls['main']);
      }

      boot().catch((err) => {
        console.error('Tradebd boot error:', err);
      });
    </script>
  </body>
