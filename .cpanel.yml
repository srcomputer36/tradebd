---
deployment:
  tasks:
    - export DEPLOYPATH=/home/tradebdo/public_html/
    - /bin/rm -f $DEPLOYPATH/welcome.php $DEPLOYPATH/index.php $DEPLOYPATH/default.html
    - /bin/rm -rf $DEPLOYPATH/assets
    - /bin/cp -Rf cpanel-build/assets $DEPLOYPATH/
    - /bin/cp -f cpanel-build/index.html $DEPLOYPATH/index.html
    - /bin/cp -f public/.htaccess $DEPLOYPATH/.htaccess
    - /bin/cp -f public/robots.txt $DEPLOYPATH/robots.txt
    - /bin/cp -f public/sitemap.xml $DEPLOYPATH/sitemap.xml
    - /bin/cp -f public/llms.txt $DEPLOYPATH/llms.txt
    - /bin/cp -f public/ai-catalog.json $DEPLOYPATH/ai-catalog.json
    - /bin/cp -f public/site.webmanifest $DEPLOYPATH/site.webmanifest
    - /bin/cp -f public/favicon.svg $DEPLOYPATH/favicon.svg
    - /bin/cp -f public/favicon.ico $DEPLOYPATH/favicon.ico
    - /bin/cp -f public/apple-touch-icon.png $DEPLOYPATH/apple-touch-icon.png
    - /bin/cp -f public/logo.svg $DEPLOYPATH/logo.svg
    - /bin/cp -f public/og-banner.png $DEPLOYPATH/og-banner.png
    - /bin/cp -f public/og-banner.svg $DEPLOYPATH/og-banner.svg
    - /bin/cp -f public/google782575ecc6870ba1.html $DEPLOYPATH/google782575ecc6870ba1.html
